
name: Build Muguet Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build server
        run: cargo build --release --bin muguet-server

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: muguet-server-linux
          path: target/release/muguet-server
